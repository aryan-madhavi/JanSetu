steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'VITE_GOOGLE_MAPS_API_KEY=${_VITE_GOOGLE_MAPS_API_KEY}'
      - '-t'
      - 'asia-south1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/jansetu:latest'
      - '.'
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/jansetu:latest'
substitutions:
  _VITE_GOOGLE_MAPS_API_KEY: ''
images:
  - 'asia-south1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/jansetu:latest'
